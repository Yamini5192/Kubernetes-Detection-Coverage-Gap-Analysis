# Custom Falco Rule — T10: List Kubernetes Secrets
# Tactic: Credential Access
# Technique: Project-defined Kubernetes Secret list operation
# Source: k8saudit (Kubernetes API audit log)
#
# This rule alerts on Secret list requests. It records request metadata only and
# does not output Secret contents. Normal controllers and administrators may
# legitimately list Secrets; tune the rule against identities and audit traffic
# in the target cluster before using it outside this lab.
#
# The Falco 0.44.1 audit rules loaded during this assessment did not include a
# Secret-list rule. This project rule is a candidate and still needs an
# end-to-end retest.

- rule: Project T10 Kubernetes Secrets Listed
  desc: >
    Detect Kubernetes API list requests for Secret resources. The alert contains
    request metadata only; it does not include Secret values.
  condition: >
    ka.verb = list
    and ka.target.resource = secrets
  output: >
    T10_KUBERNETES_SECRETS_LISTED
    (user=%ka.user.name verb=%ka.verb resource=%ka.target.resource
    namespace=%ka.target.namespace status=%ka.response.code uri=%ka.uri)
  priority: WARNING
  source: k8s_audit
  tags: [project_detection, credential_access, kubernetes, secret_list]
